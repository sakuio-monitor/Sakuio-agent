[package]
name = "sakuio-agent-collect"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sakuio-protocol.workspace = true
sysinfo.workspace = true
regex.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
raw-cpuid.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
if-addrs = "0.15"
quick-xml = { version = "0.37", features = ["serialize"] }
glob = "0.3"

[target.'cfg(not(any(target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly")))'.dependencies]
netstat2.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
] }
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.17"
