[workspace]
resolver = "2"
members = [
    "crates/sakuio-agent-collect",
    "crates/sakuio-agent-ws",
    "crates/sakuio-agent-remote",
    "crates/sakuio-agent-core",
    "crates/sakuio-agent",
]
default-members = ["crates/sakuio-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
cbor4ii = { version = "1", features = ["serde1", "use_std"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
regex = "1"
parking_lot = "0.12"
once_cell = "1"
netstat2 = "0.11"
raw-cpuid = "11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }

sakuio-protocol = { path = "../sakuio/crates/sakuio-protocol" }
sakuio-board = { path = "../sakuio/crates/sakuio-board" }
